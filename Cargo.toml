[workspace]
members = ["lychee-bin", "lychee-lib", "examples/*", "benches", "test-utils"]
resolver = "2"

[workspace.package]
version = "0.24.2"

# Browser impersonation (`--impersonate`) needs the forks that impit uses to make
# browser-like TLS ClientHellos and HTTP/2 frames. Keep these in sync with
# https://github.com/apify/impit/blob/master/Cargo.toml
[patch.crates-io]
h2 = { git = "https://github.com/apify/h2", rev = "7f393a728a8db07cabb1b78d2094772b33943b9a" }
rustls = { git = "https://github.com/apify/rustls", rev = "2b5779e20250d357aa04780fdfcfdf338b24263a" }
tower-http = { git = "https://github.com/apify/tower-http", rev = "4d96dbd81f86559c38cf76b8ce671089544a26e3" }
hyper-util = { git = "https://github.com/apify/hyper-util", rev = "401e6fb99bb6bd4956a0fafca39f4b7b37be8a0a" }
reqwest = { git = "https://github.com/seanmonstar/reqwest", rev = "2230ed3945fb2908692b88dad1dcd06db9fb2ca6" }
